version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Só aceita versões publicadas há pelo menos 7 dias.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dependencias:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
